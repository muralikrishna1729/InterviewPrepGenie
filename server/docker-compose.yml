services:
  postgres:
    image: postgres:16-alpine
    container_name: prepgenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepuser
      POSTGRES_PASSWORD: preppass
      POSTGRES_DB: prep_genie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepuser -d prep_genie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: