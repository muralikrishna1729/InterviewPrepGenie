services:
  postgres:
    image: postgres:16-alpine
    container_name: prepgenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prepuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preppass}
      POSTGRES_DB: ${POSTGRES_DB:-prep_genie_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prepuser -d prep_genie_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: prepgenie-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepgenie-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prepuser}:${POSTGRES_PASSWORD:-preppass}@postgres:5432/${POSTGRES_DB:-prep_genie_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepgenie-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prepuser}:${POSTGRES_PASSWORD:-preppass}@postgres:5432/${POSTGRES_DB:-prep_genie_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --pool=solo

volumes:
  postgres_data:
  redis_data:
